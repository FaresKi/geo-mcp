[project]
name = "geo-mcp"
version = "0.3.0"
description = "OSM multimodal navigation MCP server for LLM geo reasoning"
readme = "README.md"
authors = [
    { name = "FaresKi", email = "FaresKi@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.27,<2",
    "networkx>=3.6.1",
    "osmnx>=2.1.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "shapely>=2.1.2",
]

[project.scripts]
geo-mcp = "geo_mcp.main:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
